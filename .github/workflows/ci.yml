name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# 同一分支的新提交取消上一轮（省钱，也让"最近一次 run"不歧义）
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }} / py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # v0.2.1：floor 抬到 3.12，3.8 腿移出矩阵（3.8 已于 2024-10 EOL）
          - os: windows-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.12"

    env:
      # 本机习惯 `py -X utf8` 是 CI 盲区：CI 上 python 不是"我们敲的命令"，
      # 必须在 job env 里统一设 PYTHONUTF8=1（救所有步骤的 stdio 编码）。
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install (README 同款 extras)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install build

      - name: Full test suite
        run: python -m pytest tests/ -q --tb=short

      - name: Frozen ledger bit-identical check
        run: python -m hws_math_auditor.benchmark.generator --check

      - name: Smoke — python -m path
        run: |
          python -m hws_math_auditor selftest
          python -m hws_math_auditor benchmark --run

      - name: Smoke — bare console script path
        # `python -m <pkg>` 与裸 `<pkg>` 是两条通路（sys.path 来源不同），
        # 只跑前者会漏掉"我们的包没进安装面"这类缺陷。
        run: |
          hws-audit selftest
          hws-audit benchmark --metrics

      - name: Smoke — audit exit codes
        shell: bash
        run: |
          set +e
          hws-audit audit --input data/samples/clean_solution.txt > /dev/null; clean=$?
          hws-audit audit --input data/samples/dirty_solution.txt > /dev/null; dirty=$?
          hws-audit audit --input no/such.txt > /dev/null; missing=$?
          echo "clean=$clean dirty=$dirty missing=$missing"
          [ "$clean" = "0" ] && [ "$dirty" = "1" ] && [ "$missing" = "2" ]

  # 装态真验：非 editable 装 wheel，在**中立目录**（不是仓根）跑三条命令。
  # 这一 job 是 v0.2.1 "pip 渠道装完能用"的常驻证据——editable 装能跑
  # 不代表常规装能跑（此前 wheel 里 data/ 命中 0，正是这条漏掉的）。
  installed-wheel:
    name: installed wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist

      - name: Assert wheel carries data
        shell: bash
        run: |
          python -c "
          import glob, zipfile, sys
          whl = glob.glob('dist/*.whl')[0]
          names = zipfile.ZipFile(whl).namelist()
          packed = [n for n in names if '_data/' in n]
          print(f'{whl}: {len(names)} entries, {len(packed)} data entries')
          sys.exit(0 if len(packed) >= 40 else 1)
          "

      - name: Install into clean venv (no -e) and run from neutral dir
        shell: bash
        run: |
          set -e
          python -m venv "$RUNNER_TEMP/venv"
          if [ "$RUNNER_OS" = "Windows" ]; then
            PY="$RUNNER_TEMP/venv/Scripts/python.exe"
            BIN="$RUNNER_TEMP/venv/Scripts"
          else
            PY="$RUNNER_TEMP/venv/bin/python"
            BIN="$RUNNER_TEMP/venv/bin"
          fi
          "$PY" -m pip install --upgrade pip
          "$PY" -m pip install dist/*.whl
          mkdir -p "$RUNNER_TEMP/neutral"
          cd "$RUNNER_TEMP/neutral"
          # 中立目录：不是仓根，data/ 只能来自 wheel
          "$BIN/hws-audit" selftest
          "$BIN/hws-audit" benchmark --run
          printf '步骤1: x^2 - 4x + 3 = 0\n步骤2: (x-1)(x-3) = 0\n步骤3: x = 1 或 x = 4\n' > dirty.txt
          set +e
          "$BIN/hws-audit" audit --input dirty.txt > /dev/null
          rc=$?
          set -e
          echo "audit dirty exit=$rc"
          [ "$rc" = "1" ]

  # 退出码真实性：把验证器注入成"恒判 ok"，CLI 必须非 0。
  # 只跑 Python 层断言不够——D1 的缺陷正是"Python 层抓到了、CLI 层没接"。
  exit-code-truth:
    name: exit code truth (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Positive control — healthy engine exits 0
        shell: bash
        run: |
          python -m hws_math_auditor benchmark --run > /dev/null
          echo "healthy rc=$?"

      - name: Negative control — broken verifier must exit 1
        shell: bash
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/broken_site"
          cat > "$RUNNER_TEMP/broken_site/sitecustomize.py" <<'PY'
          from hws_math_auditor import verifier
          from hws_math_auditor.model import Verdict

          verifier.verify_step = lambda prev, curr: Verdict("ok", "injected: always ok", None)
          PY
          set +e
          PYTHONPATH="$RUNNER_TEMP/broken_site" python -m hws_math_auditor benchmark --run > /dev/null
          run_rc=$?
          PYTHONPATH="$RUNNER_TEMP/broken_site" python -m hws_math_auditor benchmark --metrics > /dev/null
          metrics_rc=$?
          set -e
          echo "broken: --run=$run_rc --metrics=$metrics_rc (期望都是 1)"
          [ "$run_rc" = "1" ] && [ "$metrics_rc" = "1" ]
